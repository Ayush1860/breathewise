AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: BreatheWise core - hourly ingest, forecast and storage

Parameters:
  ForceFail:
    Type: String
    Default: ""
    Description: Demo drill. Comma-separated sources to simulate as failing (cpcb,openaq,cams_model).
  WarmupState:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: Keep the API Lambda warm every 5 minutes (enable on event day).
  CorsOrigins:
    Type: String
    Default: "http://localhost:5173,http://localhost:3000"
    Description: Comma-separated allowed origins (add the Amplify domain when known).

Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../build/code
    Timeout: 120
    MemorySize: 512
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        TABLE_NAME: !Ref Table

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../build/common-layer
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  MlLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../build/ml-layer
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ingest.handler.handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          FORECAST_FUNCTION: !Ref ForecastFunction
          FORCE_FAIL: !Ref ForceFail
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3WritePolicy: { BucketName: !Ref DataBucket }
        - LambdaInvokePolicy: { FunctionName: !Ref ForecastFunction }
      Events:
        Hourly:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(15 * * * ? *)
            RetryPolicy:
              MaximumRetryAttempts: 1

  ForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: ml.handler.handler
      MemorySize: 1024
      Layers:
        - !Ref MlLayer
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      EventInvokeConfig:
        MaximumRetryAttempts: 0

  ProbeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: probe/
      Handler: handler.handler
      MemorySize: 1024
      Layers:
        - !Ref MlLayer

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backend.lambda_api.handler
      Timeout: 15
      Environment:
        Variables:
          INGEST_FUNCTION: !Ref IngestFunction
          CORS_ORIGINS: !Ref CorsOrigins
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - LambdaInvokePolicy: { FunctionName: !Ref IngestFunction }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
        Warmup:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
            State: !Ref WarmupState
            Input: '{"warmup": true}'

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 50

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub ${AWS::StackName}-api
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          QueryStringsConfig: { QueryStringBehavior: all }
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Origin]
          CookiesConfig: { CookieBehavior: none }

  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: BreatheWise API
        PriceClass: PriceClass_200
        HttpVersion: http2and3
        Origins:
          - Id: httpapi
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: httpapi
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref ApiCachePolicy
          # Managed "AllViewerExceptHostHeader": forwards query strings and headers, not Host
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  IngestLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${IngestFunction}
      RetentionInDays: 14

  ForecastLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ForecastFunction}
      RetentionInDays: 14

  ProbeLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProbeFunction}
      RetentionInDays: 3

  IngestErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Ingest failed at least twice in 2 hours
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref IngestFunction }
      Statistic: Sum
      Period: 7200
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ForecastErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Forecast failed at least twice in 2 hours
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - { Name: FunctionName, Value: !Ref ForecastFunction }
      Statistic: Sum
      Period: 7200
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiUrl:
    Description: Public API base URL (CloudFront)
    Value: !Sub https://${ApiDistribution.DomainName}
  HttpApiUrl:
    Description: Direct API Gateway URL (bypasses the cache)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref DataBucket
  IngestFunctionName:
    Value: !Ref IngestFunction
  ForecastFunctionName:
    Value: !Ref ForecastFunction
  ProbeFunctionName:
    Value: !Ref ProbeFunction
